name: p08

x-hadoop-env: &hadoop-env
  HADOOP_MAPRED_HOME: /opt/hadoop
  CORE-SITE.XML_fs.defaultFS: "hdfs://namenode:9000"
  CORE-SITE.XML_hadoop.tmp.dir: /data/tmp
  CORE-SITE.XML_io.file.buffer.size: "131072"
  CORE-SITE.XML_fs.trash.interval: "0"
  HDFS-SITE.XML_dfs.replication: "1"
  HDFS-SITE.XML_dfs.namenode.name.dir: /data/hdfs/name
  HDFS-SITE.XML_dfs.datanode.data.dir: /data/hdfs/data
  HDFS-SITE.XML_dfs.permissions.enabled: "false"
  HDFS-SITE.XML_dfs.blocksize: "134217728"
  HDFS-SITE.XML_dfs.namenode.http-address: "0.0.0.0:9870"
  HDFS-SITE.XML_dfs.datanode.http.address: "0.0.0.0:9864"
  HDFS-SITE.XML_dfs.datanode.address: "0.0.0.0:9866"
  HDFS-SITE.XML_dfs.webhdfs.enabled: "true"
  YARN-SITE.XML_yarn.resourcemanager.hostname: resourcemanager
  YARN-SITE.XML_yarn.resourcemanager.webapp.address: "0.0.0.0:8088"
  YARN-SITE.XML_yarn.nodemanager.aux-services: mapreduce_shuffle
  YARN-SITE.XML_yarn.nodemanager.aux-services.mapreduce_shuffle.class: org.apache.hadoop.mapred.ShuffleHandler
  YARN-SITE.XML_yarn.nodemanager.resource.memory-mb: "4096"
  YARN-SITE.XML_yarn.nodemanager.resource.cpu-vcores: "4"
  YARN-SITE.XML_yarn.scheduler.maximum-allocation-mb: "4096"
  YARN-SITE.XML_yarn.scheduler.minimum-allocation-mb: "512"
  YARN-SITE.XML_yarn.nodemanager.vmem-check-enabled: "false"
  YARN-SITE.XML_yarn.nodemanager.pmem-check-enabled: "false"
  MAPRED-SITE.XML_mapreduce.framework.name: yarn
  MAPRED-SITE.XML_yarn.app.mapreduce.am.env: HADOOP_MAPRED_HOME=/opt/hadoop
  MAPRED-SITE.XML_mapreduce.map.env: HADOOP_MAPRED_HOME=/opt/hadoop
  MAPRED-SITE.XML_mapreduce.reduce.env: HADOOP_MAPRED_HOME=/opt/hadoop
  MAPRED-SITE.XML_yarn.app.mapreduce.am.resource.mb: "1024"
  MAPRED-SITE.XML_yarn.app.mapreduce.am.command-opts: "-Xmx820m"
  MAPRED-SITE.XML_mapreduce.map.memory.mb: "1024"
  MAPRED-SITE.XML_mapreduce.reduce.memory.mb: "2048"
  MAPRED-SITE.XML_mapreduce.map.java.opts: "-Xmx820m"
  MAPRED-SITE.XML_mapreduce.reduce.java.opts: "-Xmx1640m"
  MAPRED-SITE.XML_mapreduce.task.io.sort.mb: "256"

services:
  namenode:
    image: apache/hadoop:3.3.6
    container_name: p08-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      <<: *hadoop-env
      ENSURE_NAMENODE_DIR: /data/hdfs/name
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - p08-nn:/data
      # Chemins relatifs au fichier compose : identiques pour tous les membres.
      - "../data:/p08-data:ro"
      - "../big-data/mapreduce/job1-daily/target:/job:ro"
    mem_limit: 1536m
    restart: unless-stopped

  datanode:
    image: apache/hadoop:3.3.6
    container_name: p08-datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    environment:
      <<: *hadoop-env
      WAITFOR: "namenode:9000"
    ports:
      - "9864:9864"
    volumes:
      - p08-dn:/data
    mem_limit: 1536m
    depends_on:
      - namenode
    restart: unless-stopped

  resourcemanager:
    image: apache/hadoop:3.3.6
    container_name: p08-resourcemanager
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    environment:
      <<: *hadoop-env
      WAITFOR: "namenode:9000"
    ports:
      - "8088:8088"
    volumes:
      - p08-rm:/data
    mem_limit: 1536m
    depends_on:
      - namenode
    restart: unless-stopped

  nodemanager:
    image: apache/hadoop:3.3.6
    container_name: p08-nodemanager
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    environment:
      <<: *hadoop-env
      WAITFOR: "resourcemanager:8088"
    volumes:
      - p08-nm:/data
    mem_limit: 6g
    depends_on:
      - resourcemanager
    restart: unless-stopped

volumes:
  p08-nn:
  p08-dn:
  p08-rm:
  p08-nm: